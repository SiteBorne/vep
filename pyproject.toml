[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vep-protocol"
version = "0.6.0b1"
description = "Verified Evolution Protocol: invariant-first, agent-native verification reference MVP"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
pytest = ["pytest>=7"]
mcp = ["mcp>=2.3,<3"]
a2a = ["a2a-sdk[http-server]>=1.2,<2", "uvicorn>=0.30"]
claude = ["claude-agent-sdk>=0.2,<1"]
dev = ["pytest>=7", "build", "twine", "setuptools>=68", "mcp>=2.3,<3", "a2a-sdk[http-server]>=1.2,<2", "uvicorn>=0.30", "claude-agent-sdk>=0.2,<1"]

[project.scripts]
vep = "vep.cli:main"
vep-mcp = "vep.mcp_server:main"
vep-a2a = "vep.a2a_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vep = ["_runner.py", "assets/claude/*", "assets/claude/skill/*", "assets/claude/skill/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]  # frozen historical workspaces contain their own test files that must not be collected
