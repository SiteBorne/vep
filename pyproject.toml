[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vep-protocol"
version = "0.3.0"
description = "Verified Evolution Protocol: invariant-first, agent-native verification reference MVP"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=7", "build"]

[project.scripts]
vep = "vep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vep = ["_runner.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
