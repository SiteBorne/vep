name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default. This workflow never has secrets or id-token and never runs on pull_request_target.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests (unittest)
        run: python -m unittest discover -s tests -t .
      - name: Unit tests (pytest)
        run: python -m pytest -q
      - name: Variable registry is current
        run: python scripts/gen_variables.py --check
      - name: End-to-end demo
        run: python examples/run_demo.py
      - name: Simulation reproducibility
        run: python benchmarks/run_simulation.py --tasks 2000 --out-json "$RUNNER_TEMP/b.json" --out-md "$RUNNER_TEMP/b.md"
      - name: Static release checks (secrets, workflows, claims, versions)
        run: python scripts/release/ci_checks.py

  package:
    name: build and install artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build --outdir dist
          python -m twine check --strict dist/*
      - name: Audit artifacts
        run: python scripts/release/ci_checks.py --dist dist
      - name: Clean-room install and use
        run: |
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install dist/*.whl
          python scripts/release/cleanroom.py --venv "$RUNNER_TEMP/v"
          python scripts/release/quickstart_runner.py --bin-dir "$RUNNER_TEMP/v/bin"
