name: Isolation (gVisor)

# Exercises the Docker+gVisor isolation path on a hosted Linux runner. It runs only code from the pushed
# `isolation-ci` branch or a manual dispatch by someone with write access; never pull_request_target, no secrets,
# read-only token. The only artifact is the attestation and a summary (no keys, no databases).
# A pass shows the T1-T12 matrix held for THIS runner, runtime and image. It does not prove escape resistance and
# the signing key used below is an ephemeral demonstration key, not a trusted issuer.
on:
  workflow_dispatch:
  push:
    branches: [isolation-ci]

permissions:
  contents: read

jobs:
  gvisor:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # gVisor archive key fingerprint, recorded from https://gvisor.dev/archive.key on 2026-10-19 (primary key).
      GVISOR_KEY_FPR: 6F1DF85E3A71C24918E727D56FC6D554E32BD943
      # python:3.13-slim image-index digest resolved from Docker Hub on 2026-10-19; pulled by digest only.
      IMAGE: python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install VEP
        run: python -m pip install -e .
      - name: Install gVisor from the official signed apt repository (key fingerprint pinned)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl gnupg
          curl -fsSL https://gvisor.dev/archive.key -o "$RUNNER_TEMP/gvisor.key"
          GOT=$(gpg --show-keys --with-colons "$RUNNER_TEMP/gvisor.key" | awk -F: '$1=="fpr"{print $10; exit}')
          echo "key fingerprint: $GOT"
          test "$GOT" = "$GVISOR_KEY_FPR" || { echo "gVisor key fingerprint mismatch"; exit 1; }
          gpg --dearmor < "$RUNNER_TEMP/gvisor.key" | sudo tee /usr/share/keyrings/gvisor-archive-keyring.gpg > /dev/null
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          runsc --version
      - name: Register runsc with Docker
        run: |
          set -euo pipefail
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}'
      - name: Pull the pinned image by digest
        run: |
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}'
      - name: Capability detection
        run: python -m vep.cli isolation detect --image "$IMAGE" --json
      - name: Verification matrix T1-T12
        id: matrix
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python -m vep.cli isolation verify --image "$IMAGE" --out "$RUNNER_TEMP/out/attestation.json" --json | tee "$RUNNER_TEMP/out/matrix-summary.json"
      - name: Isolated evaluation, certification and independent verification
        run: python scripts/release/isolated_e2e.py --image "$IMAGE" --attestation "$RUNNER_TEMP/out/attestation.json" --out "$RUNNER_TEMP/out/e2e-summary.json"
      - name: Upload attestation and summaries only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolation-attestation
          path: |
            ${{ runner.temp }}/out/attestation.json
            ${{ runner.temp }}/out/matrix-summary.json
            ${{ runner.temp }}/out/e2e-summary.json
          if-no-files-found: warn
